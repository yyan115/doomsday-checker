name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Lint and test
        run: |
          ruff check
          pytest
      - name: Audit runtime dependencies
        run: python -m pip_audit --strict --disable-pip --require-hashes -r requirements.lock

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build container images
        run: docker compose build
      - name: Check browser connectivity and isolation
        run: |
          cp config.example.toml config.local.toml
          umask 077
          printf 'CHECKER_UID=%s\nCHECKER_GID=%s\n' "$(id -u)" "$(id -g)" > .env
          mkdir data
          docker compose run --rm -T --entrypoint python watcher - <<'PY'
          import os
          from contextlib import closing

          from doomsday_checker.sources.shaw_browser import ShawBrowser

          with closing(ShawBrowser(None, endpoint=os.environ['SHAW_BROWSER_WS_URL'])) as browser:
              browser._open()
              browser._page.set_content('<title>Checker browser ready</title>')
              assert browser._page.title() == 'Checker browser ready'
          PY
          docker compose exec -T browser python - <<'PY'
          import os
          from pathlib import Path

          assert os.getuid() != 0
          assert not any(key.startswith('TELEGRAM_') for key in os.environ)
          assert not Path('/config/.env').exists()
          assert not Path('/data/state.db').exists()
          PY
      - name: Remove test containers
        if: always()
        run: docker compose down
