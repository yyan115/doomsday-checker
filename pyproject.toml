[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doomsday-checker"
version = "0.1.0"
description = "Monitor Singapore cinema showtimes and seat availability."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "pillow>=13,<14",
    "playwright>=1.50,<2",
]

[project.scripts]
doomsday-checker = "doomsday_checker.main:main"

[project.optional-dependencies]
dev = ["pip-audit>=2.9,<3", "pytest>=8", "ruff>=0.9"]

[dependency-groups]
build = ["setuptools>=77"]

[tool.setuptools.packages.find]
include = ["doomsday_checker*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
